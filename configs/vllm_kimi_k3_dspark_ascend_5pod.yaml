# Kimi-K3 DSpark continual training — Ascend 5-pod online setup
#
# Pod layout (80 NPUs across 5 pods, 16 x 64GB each):
#   - dspark-training-sy0/1/3/6 (64 NPUs): inference, TP=16 x DP=4
#     (one vLLM engine per pod, 4 data-parallel replicas)
#   - dspark-training-sy7 (16 NPUs): Ray head + FSDP training
#
# Ascend notes:
#   - Inference: pass quantization=ascend via vLLM extra_args
#   - Training: attention_backend=sdpa (FlexAttention is CUDA-oriented;
#     DFlash/DSpark now materialize a correct block-causal SDPA attn_mask on NPU)
#   - Prefer tcp Mooncake unless RDMA is verified on the Ascend fabric
#
# Fill the ??? placeholders (paths + node IPs), convert the HF draft once, then:
#   python -m torchspec.train_entry --config configs/vllm_kimi_k3_dspark_ascend_5pod.yaml

model:
  target_model_path: /a3_inference/itask/workdir/shared/models/modelhub_69400046_kimi-k3-w4a8-norope-142600122_20260824234539/model
  draft_model_config: configs/draft_models/kimi_k3_dspark_mla.json
  target_model_backend: vllm
  trust_remote_code: true
  embedding_key: language_model.model.embed_tokens.weight
  lm_head_key: language_model.lm_head.weight
  norm_key: language_model.model.norm.weight

dataset:
  train_data_path: /a3_inference/itask/workdir/shared/libowen/success.jsonl
  eval_data_path: null
  eval_interval: 50
  eval_prompt_key: messages
  prompt_key: messages
  renderer: kimi-k3
  chat_template: null
  defer_tokenization: false
  last_turn_loss_only: true
  shuffle_dataset: true
  length_group_size: 1
  # DSpark needs at least two complete seven-token diffusion blocks.
  min_loss_tokens: 14

training:
  max_seq_length: 4096  # start lower on 64GB NPU; raise if memory allows
  seed: 42
  micro_batch_size: 1
  # 16 training ranks x one sequence x 8 microbatches = 128.
  draft_accumulation_steps: 8
  learning_rate: 5.0e-5
  warmup_ratio: 0.04
  lr_decay_style: cosine
  min_lr: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  ttt_length: 7
  num_epochs: 5
  save_interval: 1000
  save_per_epoch: true
  max_concurrent_batches: 1
  gradient_checkpointing: true
  attention_backend: sdpa
  distributed_backend: hccl
  placement_strategy: custom
  training_num_nodes: 1
  training_num_gpus_per_node: 16
  # Replace with the Ray-visible IP of dspark-training-sy7
  training_node_ips:
    - 10.30.13.111  # sy7
  fsdp_strategy: FULL_SHARD
  distributed_timeout_minutes: 60
  # Ascend HCCL / socket interfaces — set to your cluster NICs.
  # train_env_vars: '{"HCCL_SOCKET_IFNAME":"<iface>","GLOO_SOCKET_IFNAME":"<iface>"}'

  dflash_block_size: 7
  dspark_num_anchors: 512
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0

  # Warm-start from converted TorchSpec init (see README in examples/).
  load_path: /a3_inference/itask/workdir/shared/wjf02357757/kimi_k3_dspark_init
  continual_training: true

inference:
  inference_engine_type: vllm
  # TP16 x DP4 across 4 pods
  inference_num_gpus: 64
  inference_num_gpus_per_engine: 16
  inference_num_gpus_per_node: 16
  # Replace with Ray-visible IPs of sy1, sy2, sy5, sy6 (order = engine ranks)
  inference_node_ips:
    - 10.30.14.49   # sy0
    - 10.30.13.136  # sy1
    - 10.30.14.36   # sy3
    - 10.30.13.45   # sy6
  # Lockstep EP64: one batch per DP rank, so this is the per-engine batch.
  inference_batch_size: 1
  inference_buffer_threshold: 4
  inference_fetch_batch: 4
  max_sample_pool_size: 16
  store_last_hidden_states: true
  # Must match target_layer_ids in configs/draft_models/kimi_k3_dspark_mla.json
  aux_hidden_states_layers: [7, 31, 47, 63, 87]
  last_hidden_states_prenorm: true

  vllm:
    tp_size: 16
    pp_size: 1
    nnodes: 1
    # Four single-node TP16 engines, one expert-parallel group (EP = 16*4 = 64).
    dp_size: 4
    init_timeout: 3600
    dist_timeout: 1800
    # Align with launch-kimik3-w4a8.sh (GPU_MEM_UTIL=0.9)
    mem_fraction_static: 0.90
    extra_args:
      quantization: ascend
      enable_expert_parallel: true
      # Prefer script-style decode cudagraph over full eager
      enforce_eager: true
      max_model_len: 4096
      max_num_batched_tokens: 4096
      max_num_seqs: 4
      enable_chunked_prefill: true
      enable_prefix_caching: false
      seed: 1024
      safetensors_load_strategy: prefetch
      mamba_cache_mode: align
      mm_processor_cache_gb: 4
      compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
      # From launch-kimik3-w4a8.sh --additional-config
      additional_config:
        enable_cpu_binding: true
        enable_flashcomm1: false
        multistream_overlap_shared_expert: true
        enable_shared_expert_dp: false
        recompute_scheduler_enable: false
        finegrained_tp_config:
          markov_tensor_parallel_size: 1

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  enable_gpu_direct: false
  hidden_dim: 7168
  enable_hard_pin: true
  kv_lease_ttl_s: 180.0
  get_retry_max_wait_seconds: 180.0
  global_segment_size: 256GB
  local_buffer_size: 8GB

output_dir: /a3_inference/itask/workdir/shared/wjf02357757/outputs/kimi-k3-dspark-ascend
cache_dir: /a3_inference/itask/workdir/shared/wjf02357757/cache/kimi-k3-dspark-ascend
model_download_dir: null

debug:
  save_debug_train_data: null
  enable_perf_metrics: true

logging:
  report_to: none
  wandb_key: null
  wandb_project: train_kimi_k3_dspark_ascend
  wandb_team: null
  wandb_group: null
  wandb_mode: online
  wandb_random_suffix: true
